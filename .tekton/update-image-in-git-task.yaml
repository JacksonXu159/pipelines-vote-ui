# Task: update-image-in-git
#
# After buildah pushes the new image, this task patches k8s/deployment.yaml
# with the new image reference and commits + pushes it back to the repo.
# ArgoCD detects the Git change and auto-syncs the new image to the cluster.
#
# Requires in poc-pipelines namespace:
#   Secret  github-webhook-config  → key: provider.token  (GitHub PAT)
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-image-in-git
spec:
  description: >-
    Patches k8s/deployment.yaml with the newly built image tag and pushes
    the change back to the Git repository. ArgoCD picks up the diff and
    deploys the new image automatically.
  params:
    - name: repo-url
      description: HTTPS clone URL of the repository
      type: string
    - name: revision
      description: Branch to commit and push to
      type: string
    - name: image
      description: Full image reference including tag/digest to write into the manifest
      type: string
    - name: deployment-manifest
      description: Path to the deployment manifest inside the repo
      type: string
      default: k8s/deployment.yaml
  workspaces:
    - name: source
      description: Workspace containing the cloned repository
  steps:
    - name: patch-and-push
      image: registry.redhat.io/ubi9/ubi-minimal:latest
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-webhook-config
              key: provider.token
      script: |
        #!/usr/bin/env bash
        set -e

        # Install git (minimal image needs it)
        microdnf install -y git --nodocs 2>/dev/null

        cd "$(workspaces.source.path)"

        # Configure git identity
        git config user.email "tekton-pipeline@poc-pipelines"
        git config user.name "Tekton Pipeline"

        # Inject token into remote URL for authenticated push
        REPO_URL="$(params.repo-url)"
        AUTHED_URL="${REPO_URL/https:\/\//https:\/\/${GITHUB_TOKEN}@}"
        git remote set-url origin "$AUTHED_URL"

        # Patch the image field in the deployment manifest
        MANIFEST="$(params.deployment-manifest)"
        NEW_IMAGE="$(params.image)"

        echo "==> Patching $MANIFEST"
        echo "    image: $NEW_IMAGE"

        # Use sed to replace the image line under containers
        sed -i "s|image:.*|image: $NEW_IMAGE|" "$MANIFEST"

        echo ""
        echo "==> Diff:"
        git diff "$MANIFEST"

        # Check if there's actually a change to commit
        if git diff --quiet "$MANIFEST"; then
          echo "==> No change to commit (image already up to date)"
          exit 0
        fi

        git add "$MANIFEST"
        git commit -m "chore: update image to $NEW_IMAGE [skip ci]"

        echo ""
        echo "==> Pushing to $(params.revision)"
        git push origin HEAD:"$(params.revision)"

        echo ""
        echo "=================================================="
        echo "  Image manifest updated"
        echo "  Manifest : $MANIFEST"
        echo "  Image    : $NEW_IMAGE"
        echo "  Branch   : $(params.revision)"
        echo "=================================================="
