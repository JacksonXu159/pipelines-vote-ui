# Task: smoke-test
#
# Post-deploy health gate — runs after argocd-sync-and-wait confirms
# the ArgoCD sync is complete.
#
# Two-stage verification:
#   Stage 1 — oc rollout status: confirms the Deployment's pods have
#             all rolled over to the new ReplicaSet and are Ready.
#             Catches: image pull failures, OOMKilled, bad probes, etc.
#
#   Stage 2 — HTTP health check: hits the app's in-cluster Service
#             endpoint and asserts a 2xx response.
#             Catches: app starts but crashes on first request, wrong
#             port, misconfigured env vars that only surface at runtime.
#
# Both stages must pass for the pipeline to succeed.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: smoke-test
spec:
  description: >-
    Production-grade post-deploy health gate. Verifies the deployment
    rolled out cleanly (rollout status) and that the app responds to
    HTTP traffic (health check). Fails the pipeline if either check
    does not pass within the configured timeouts.
  params:
    - name: deployment-name
      description: Name of the Deployment to verify
      type: string
      default: pipelines-vote-ui
    - name: namespace
      description: Namespace the Deployment lives in
      type: string
      default: poc-pipelines
    - name: service-name
      description: Name of the Service to health-check
      type: string
      default: pipelines-vote-ui
    - name: service-port
      description: Port the Service exposes
      type: string
      default: "8080"
    - name: health-path
      description: HTTP path to check (should return 2xx)
      type: string
      default: "/"
    - name: rollout-timeout
      description: Seconds to wait for rollout to complete
      type: string
      default: "180"
    - name: http-retries
      description: Number of times to retry the HTTP check before failing
      type: string
      default: "12"
    - name: http-retry-interval
      description: Seconds between HTTP check retries
      type: string
      default: "5"
  steps:
    # ------------------------------------------------------------------
    # Stage 1: rollout status
    # ------------------------------------------------------------------
    - name: rollout-status
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        set -e

        echo "=================================================="
        echo "  Stage 1: Rollout Status"
        echo "  Deployment : $(params.deployment-name)"
        echo "  Namespace  : $(params.namespace)"
        echo "  Timeout    : $(params.rollout-timeout)s"
        echo "=================================================="
        echo ""

        if oc rollout status deployment/"$(params.deployment-name)" \
            -n "$(params.namespace)" \
            --timeout="$(params.rollout-timeout)s"; then
          echo ""
          echo "==> Rollout complete ✓"
        else
          echo ""
          echo "==> Rollout did not complete within $(params.rollout-timeout)s"
          echo ""
          echo "--- Deployment describe ---"
          oc describe deployment/"$(params.deployment-name)" \
            -n "$(params.namespace)" || true
          echo ""
          echo "--- Pod status ---"
          oc get pods -n "$(params.namespace)" \
            -l app="$(params.deployment-name)" || true
          echo ""
          echo "--- Recent pod events ---"
          oc get events -n "$(params.namespace)" \
            --field-selector reason!=Scheduled \
            --sort-by='.lastTimestamp' | tail -20 || true
          exit 1
        fi

    # ------------------------------------------------------------------
    # Stage 2: HTTP health check
    # ------------------------------------------------------------------
    - name: http-healthcheck
      image: registry.redhat.io/ubi9/ubi-minimal:latest
      script: |
        #!/usr/bin/env bash
        set -e

        URL="http://$(params.service-name).$(params.namespace).svc.cluster.local:$(params.service-port)$(params.health-path)"
        RETRIES="$(params.http-retries)"
        INTERVAL="$(params.http-retry-interval)"

        echo "=================================================="
        echo "  Stage 2: HTTP Health Check"
        echo "  URL      : $URL"
        echo "  Retries  : $RETRIES x ${INTERVAL}s"
        echo "=================================================="
        echo ""

        for i in $(seq 1 "$RETRIES"); do
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            --max-time 10 \
            --connect-timeout 5 \
            "$URL" 2>/dev/null || echo "000")

          if [[ "$HTTP_STATUS" =~ ^2 ]]; then
            echo "==> Attempt $i: HTTP $HTTP_STATUS ✓"
            echo ""
            echo "=================================================="
            echo "  Smoke test gate: PASSED"
            echo "  Rollout  : complete"
            echo "  HTTP     : $HTTP_STATUS"
            echo "  App      : $(params.deployment-name)"
            echo "=================================================="
            exit 0
          fi

          echo "==> Attempt $i/$RETRIES: HTTP $HTTP_STATUS — retrying in ${INTERVAL}s"
          sleep "$INTERVAL"
        done

        echo ""
        echo "==> App did not return 2xx after $RETRIES attempts"
        echo ""
        echo "--- Last response body ---"
        cat /tmp/response.txt || true
        echo ""
        echo "=================================================="
        echo "  Smoke test gate: FAILED"
        echo "  HTTP check returned: $HTTP_STATUS"
        echo "=================================================="
        exit 1
